name: Tests

# on:
#   push:
#     branches:
#       - '*'
#       - '!main'

on:
  push:
    branches-ignore:
      - main
      - master
    paths:
      - "frontend/**"

jobs:
  build:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Run Tests
        run: |
          yarn install
          # yarn test
        env:
          CI: true
